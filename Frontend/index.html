<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12131b">
    <title>Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <aside class="sidebar" aria-label="Chat navigation">
            <button class="new-chat" id="newChatButton" type="button" aria-label="Start a new chat">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span>New chat</span>
            </button>
            <div class="sidebar-note">Your conversations appear here</div>
            <div class="sidebar-footer">
                <span class="gemini-mark" aria-hidden="true">✦</span>
                <span>Gemini</span>
            </div>
        </aside>

        <section class="main-panel" aria-label="Gemini chat">
            <header class="topbar">
                <button class="mobile-new-chat" id="mobileNewChatButton" type="button" aria-label="Start a new chat">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                </button>
                <div class="brand"><span class="gemini-mark" aria-hidden="true">✦</span> Gemini</div>
                <span class="model-label">2.5 Flash</span>
            </header>

            <div class="conversation" id="conversation" aria-live="polite">
                <div class="welcome" id="welcome">
                    <div class="welcome-mark" aria-hidden="true">✦</div>
                    <h1>Hello, how can I help?</h1>
                    <p>Ask a question, explore an idea, or start a conversation.</p>
                    <div class="suggestions" aria-label="Suggested prompts">
                        <button class="suggestion" type="button">Explain a tricky idea in simple terms</button>
                        <button class="suggestion" type="button">Help me plan a productive day</button>
                        <button class="suggestion" type="button">Give me ideas for a weekend project</button>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <footer class="composer-wrap">
                <form class="composer" id="composer">
                    <textarea id="question" rows="1" maxlength="20000" aria-label="Message Gemini"
                        placeholder="Ask Gemini"></textarea>
                    <div class="composer-bottom">
                        <span class="composer-hint">Gemini can make mistakes. Check important info.</span>
                        <button class="send-button" id="sendButton" type="submit" aria-label="Send message" disabled>
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 19V5M5 12l7-7 7 7"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </footer>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
